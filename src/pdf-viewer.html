<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PageNarrator PDF</title>
    <link rel="icon" type="image/png" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="./pdf-viewer.css" />
  </head>
  <body>
    <header class="viewer-header">
      <div>
        <h1>PageNarrator PDF</h1>
        <p id="pdf-status" role="status">Loading document...</p>
      </div>
      <div id="pdf-toolbar" class="pdf-toolbar" role="toolbar" aria-label="PDF controls">
        <div class="toolbar-group page-toolbar">
          <label class="page-field" for="pdf-page-input">
            <span>Page</span>
            <input id="pdf-page-input" type="number" min="1" value="1" inputmode="numeric" aria-label="Page 1 of 1" />
          </label>
          <span id="pdf-page-count" class="page-count">/ 1</span>
        </div>
        <div class="toolbar-group zoom-toolbar">
          <button id="pdf-zoom-out-btn" type="button" aria-label="Zoom out" title="Zoom out">-</button>
          <output id="pdf-zoom-label" aria-live="polite">100%</output>
          <button id="pdf-zoom-in-btn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
        </div>
        <div class="toolbar-group rotate-toolbar">
          <button id="pdf-rotate-left-btn" type="button" aria-label="Rotate left" title="Rotate left">&#8634;</button>
          <button id="pdf-rotate-right-btn" type="button" aria-label="Rotate right" title="Rotate right">&#8635;</button>
        </div>
        <div class="toolbar-group fit-toolbar" role="group" aria-label="Fit mode">
          <button id="pdf-fit-width-btn" type="button" aria-pressed="true">Fit width</button>
          <button id="pdf-fit-page-btn" type="button" aria-pressed="false">Fit page</button>
        </div>
      </div>
    </header>
    <main id="pdf-pages" class="pdf-pages" aria-label="PDF pages"></main>
    <script type="module" src="./pdf-viewer.js"></script>
  </body>
</html>
