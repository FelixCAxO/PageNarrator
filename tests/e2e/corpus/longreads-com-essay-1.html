<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Longreads essay</title></head><body><main><article><h1>Walking the river road</h1><p>The road follows the river for thirty miles, passing farms, mills, bridges, and empty stations.</p><p>Each bend carries a story about work, weather, memory, and the slow return of birds.</p><p>By evening the water turns silver and the town lights appear one by one.</p></article></main></body></html>
